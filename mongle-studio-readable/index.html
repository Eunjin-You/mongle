<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <meta name="description" content="큰 목표를 오늘 바로 시작할 수 있는 작은 행동으로. 나의 프로젝트가 자라는 작업실.">
  <title>몽글작업실 — 나의 작은 집필실</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- 사진을 직접 두 장으로 자른 파일입니다. HTML에서 이미지를 바꿔도 됩니다. -->
  <aside class="side-art side-art--left" aria-hidden="true">
    <img src="images/atelier-left.webp" alt="">
  </aside>
  <aside class="side-art side-art--right" aria-hidden="true">
    <img src="images/atelier-right.webp" alt="">
  </aside>

  <div class="site-shell">
    <header class="site-header" id="site-header">
      <button class="brand" id="brand-home" type="button" aria-label="작업실 홈으로">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span>몽글작업실<span class="brand-dot">.</span></span>
      </button>
      <nav class="top-nav" aria-label="주요 메뉴">
        <button type="button" id="nav-projects">프로젝트</button>
        <button type="button" id="nav-journal">작업 일지</button>
      </nav>
    </header>

    <!-- 화면은 아래 template 중 하나씩만 표시됩니다. -->
    <main id="app" class="app" aria-live="polite"></main>

    <footer class="site-footer" id="site-footer">
      <span>Small steps, real work.</span>
      <span>당신의 작업을 위한 조용한 공간</span>
    </footer>
  </div>

  <!-- ==========================================================
       HTML 화면 모음
       설명 문구, 입력창, 버튼을 수정할 때는 여기서 편집하세요.
       data-action / data-form / name / id는 기능 연결에 필요합니다.
       ========================================================== -->

  <!-- 01. 첫 방문 화면 -->
  <template id="view-welcome">
    <section class="screen">
      <div class="hero">
        <div class="hero-mark" aria-hidden="true">✳</div>
        <p class="eyebrow">YOUR CREATIVE STUDIO</p>
        <h1 class="page-title">거창한 계획보다,<br><strong>오늘의 첫 문장부터.</strong></h1>
        <p class="subtext">언젠가 완성할 일을 오늘 시작할 수 있는 크기로.<br>
          만들고 있는 것이 있다면, 여기는 당신의 작업실이에요.</p>
        <div class="button-row">
          <button class="primary" type="button" data-action="new-project">내 프로젝트 시작하기 →</button>
          <button class="secondary" type="button" data-action="sample-project">예시로 살펴보기</button>
        </div>
        <p class="small-note first-screen-note">회원가입 없이 이 브라우저에만 기록됩니다.</p>
      </div>
    </section>
  </template>

  <!-- 02. 새 프로젝트 -->
  <template id="view-project-new">
    <section class="screen">
      <div class="progress-top" data-step="1"><span>STEP 01 / 06</span><div class="track"><span></span></div><span>프로젝트의 첫걸음</span></div>
      <div class="intro">
        <p class="eyebrow">A NEW WORK BEGINS</p>
        <h1 class="page-title">어떤 작품을<br>만들고 있나요?</h1>
        <p class="subtext">한 문장으로 설명하기 어려운 커다란 목표여도 괜찮아요.</p>
      </div>
      <form class="paper" data-form="project-new">
        <label class="field">
          <span class="field-label">프로젝트 이름</span>
          <input class="text-input" name="title" maxlength="90" placeholder="예: 나의 첫 장편소설" required autofocus>
        </label>
        <label class="field">
          <span class="field-label">언제 완성되었다고 말할 수 있나요?</span>
          <textarea class="text-area" name="definition" maxlength="220" placeholder="예: 처음부터 끝까지 읽을 수 있는 초고 한 편이 생겼을 때" required></textarea>
          <span class="field-help">완벽한 결과보다, 분명한 완성 조건을 정해보세요.</span>
        </label>
        <div class="field">
          <span class="field-label">어떤 종류의 작업인가요?</span>
          <div class="pill-row">
            <label class="pill project-type-pill"><input type="radio" name="type" value="writing" checked> 글쓰기</label>
            <label class="pill project-type-pill"><input type="radio" name="type" value="design"> 디자인</label>
            <label class="pill project-type-pill"><input type="radio" name="type" value="coding"> 개발</label>
            <label class="pill project-type-pill"><input type="radio" name="type" value="other"> 다른 프로젝트</label>
          </div>
        </div>
        <button class="primary full" type="submit">내 작업실 열기 →</button>
      </form>
      <button class="quiet bottom-link" type="button" data-action="navigate" id="project-new-back">뒤로 가기</button>
    </section>
  </template>

  <!-- 03. 작업실 개관식 : 타이틀과 프로젝트 정보는 JS가 채웁니다. -->
  <template id="view-ceremony">
    <section class="screen">
      <div class="ceremony">
        <div class="ceremony-stamp" aria-hidden="true">✳</div>
        <p class="eyebrow" id="ceremony-role"></p>
        <h1 class="page-title" id="ceremony-title"></h1>
        <p class="subtext" id="ceremony-subtitle"></p>
        <span class="ceremony-name" id="ceremony-project"></span>
        <p class="subtext ceremony-definition" id="ceremony-definition"></p>
        <p class="small-note">이제 이 프로젝트의 모든 작은 진전을 이곳에 모으겠습니다.</p>
      </div>
      <div class="button-row">
        <button class="primary" type="button" id="ceremony-next"></button>
      </div>
    </section>
  </template>

  <!-- 04. 첫 작업 단계(Phase) 만들기 -->
  <template id="view-phase-new">
    <section class="screen">
      <div class="progress-top" data-step="2"><span>STEP 02 / 06</span><div class="track"><span></span></div><span>프로젝트의 첫걸음</span></div>
      <div class="intro">
        <p class="eyebrow">MAKE A CHAPTER</p>
        <h1 class="page-title">전체를 다 계획하지<br>않아도 괜찮아요.</h1>
        <p class="subtext"><strong id="phase-project-name"></strong>을(를) 이루는 첫 번째 단계는 무엇인가요?</p>
      </div>
      <form class="paper" data-form="phase-new">
        <label class="field">
          <span class="field-label">지금 진행할 작업 단계 하나</span>
          <input class="text-input" name="phaseTitle" maxlength="100" placeholder="예: 도입부 초고 쓰기" required autofocus>
          <span class="field-help">처음에는 한 단계만 적어도 됩니다. 나머지는 만들면서 추가할 수 있어요.</span>
        </label>
        <button class="primary full" type="submit">이 단계의 첫 행동 찾기 →</button>
      </form>
      <button class="quiet bottom-link" type="button" data-action="navigate" data-screen="project-detail">프로젝트로 돌아가기</button>
    </section>
  </template>

  <!-- 05. 첫 행동: 이 질문 3개가 작업 분해 UX의 중심입니다. -->
  <template id="view-action-new">
    <section class="screen">
      <div class="progress-top" data-step="3"><span>STEP 03 / 06</span><div class="track"><span></span></div><span>프로젝트의 첫걸음</span></div>
      <div class="intro">
        <p class="eyebrow">FIND THE FIRST MOVE</p>
        <h1 class="page-title">지금 바로 할 수 있는<br><strong>첫 행동은 뭘까요?</strong></h1>
        <p class="subtext" id="action-phase-name"></p>
      </div>
      <div class="breakdown-help">
        <div class="helper-question">지금 무엇을 하면 이 단계가 조금이라도 앞으로 갈까요?</div>
        <div class="helper-question">행동이 너무 크다면, 첫 10~20분에 할 부분만 적어볼까요?</div>
        <div class="helper-question">결과를 확인할 수 있는 구체적인 행동인가요?</div>
      </div>
      <form class="paper" data-form="action-new">
        <label class="field">
          <span class="field-label">첫 행동</span>
          <input class="text-input" name="actionTitle" id="action-title-field" maxlength="130" placeholder="예: 첫 장면의 장소 세 군데 적기" required autofocus>
        </label>
        <div class="field">
          <span class="field-label">이 행동 전체에 걸릴 예상 시간</span>
          <div class="pill-row" id="estimate-pills">
            <button class="pill" type="button" data-action="set-estimate" data-value="10">10분</button>
            <button class="pill" type="button" data-action="set-estimate" data-value="15">15분</button>
            <button class="pill" type="button" data-action="set-estimate" data-value="25">25분</button>
            <button class="pill" type="button" data-action="set-estimate" data-value="45">45분</button>
            <button class="pill" type="button" data-action="set-estimate" data-value="60">60분</button>
            <button class="pill" type="button" data-action="set-estimate" data-value="90">90분</button>
          </div>
          <input type="hidden" name="estimate" id="estimate-value" value="25">
          <span class="field-help">작업 전체 예상 시간이에요. 오늘 꼭 이만큼 할 필요는 없어요.</span>
        </div>
        <button class="primary full" type="submit">이 정도면 시작할 수 있어요 →</button>
      </form>
      <button class="quiet bottom-link" type="button" data-action="navigate" data-screen="project-detail">단계 목록으로</button>
    </section>
  </template>

  <!-- 06. 작업 전에 방해 요소 확인 -->
  <template id="view-readiness">
    <section class="screen">
      <div class="progress-top" data-step="4"><span>STEP 04 / 06</span><div class="track"><span></span></div><span>프로젝트의 첫걸음</span></div>
      <div class="intro">
        <p class="eyebrow">REMOVE A SMALL OBSTACLE</p>
        <h1 class="page-title">시작 전에 필요한 것이<br>있나요?</h1>
        <p class="subtext">첫 행동을 가로막는 준비물이 있다면 그것부터 하나의 행동으로 만들어요.</p>
      </div>
      <div class="task-preview">
        <span class="mini-kicker">정해둔 첫 행동</span>
        <strong id="readiness-action-title"></strong>
        <small id="readiness-action-minutes"></small>
      </div>
      <div class="choice-stack" id="ready-options">
        <button type="button" class="choice-card" data-action="set-ready" data-value="yes">
          <span><span class="choice-title">아니요, 바로 시작할 수 있어요</span><span class="choice-desc">오늘의 컨디션에 맞춰 시작해볼게요.</span></span>
          <span class="choice-icon">↗</span>
        </button>
        <button type="button" class="choice-card" data-action="set-ready" data-value="no">
          <span><span class="choice-title">네, 먼저 준비할 게 있어요</span><span class="choice-desc">준비 자체를 오늘의 첫 행동으로 만들어요.</span></span>
          <span class="choice-icon">＋</span>
        </button>
      </div>
      <div class="paper flat readiness-extra hidden" id="readiness-extra">
        <label class="field">
          <span class="field-label">무엇을 준비하면 시작할 수 있을까요?</span>
          <input class="text-input" id="prep-title" maxlength="130" placeholder="예: 원고 파일 열고 참고자료 모으기">
        </label>
        <label class="field readiness-last-field">
          <span class="field-label">예상 시간</span>
          <select class="select-input" id="prep-minutes">
            <option value="5">5분</option>
            <option value="10" selected>10분</option>
            <option value="15">15분</option>
            <option value="25">25분</option>
          </select>
        </label>
      </div>
      <div class="button-row"><button class="primary" type="button" data-action="confirm-readiness">오늘의 컨디션 살펴보기 →</button></div>
    </section>
  </template>

  <!-- 07. 오늘의 컨디션 -->
  <template id="view-mood">
    <section class="screen">
      <div class="progress-top" data-step="5"><span>STEP 05 / 06</span><div class="track"><span></span></div><span>프로젝트의 첫걸음</span></div>
      <div class="intro">
        <p class="eyebrow">TODAY, AT YOUR PACE</p>
        <h1 class="page-title">오늘은 어떤 속도로<br>작업할 수 있을까요?</h1>
        <p class="subtext">똑같은 프로젝트도 어떤 날은 10분부터, 어떤 날은 45분부터 시작할 수 있어요.</p>
      </div>
      <div class="choice-stack" id="mode-options">
        <button class="choice-card" type="button" data-action="choose-mode" data-value="gentle">
          <span><span class="choice-title">조금 버거운 날</span><span class="choice-desc">오늘은 10분짜리 시작 하나면 충분해요.</span></span>
          <span class="choice-icon">☁</span>
        </button>
        <button class="choice-card" type="button" data-action="choose-mode" data-value="steady">
          <span><span class="choice-title">평소 같은 날</span><span class="choice-desc">조용히 25분씩 두 번, 무리 없이 이어가요.</span></span>
          <span class="choice-icon">◒</span>
        </button>
        <button class="choice-card" type="button" data-action="choose-mode" data-value="bright">
          <span><span class="choice-title">잘 풀릴 것 같은 날</span><span class="choice-desc">조금 길게 몰입해도 좋겠어요. 쉴 틈도 남겨두고요.</span></span>
          <span class="choice-icon">☼</span>
        </button>
      </div>
      <div class="paper flat mood-feelings">
        <p class="field-label">지금 마음은 어떤가요? <span class="optional-label">(선택)</span></p>
        <div class="pill-row" id="feeling-options">
          <button class="pill" type="button" data-action="choose-feeling" data-value="차분해요">차분해요</button>
          <button class="pill" type="button" data-action="choose-feeling" data-value="조금 불안해요">조금 불안해요</button>
          <button class="pill" type="button" data-action="choose-feeling" data-value="자꾸 미루게 돼요">자꾸 미루게 돼요</button>
          <button class="pill" type="button" data-action="choose-feeling" data-value="기운이 없어요">기운이 없어요</button>
          <button class="pill" type="button" data-action="choose-feeling" data-value="아이디어가 많아요">아이디어가 많아요</button>
        </div>
      </div>
      <div class="button-row"><button class="primary" type="button" data-action="confirm-mood">오늘 할 만큼만 골라볼게요 →</button></div>
      <p class="small-note">컨디션은 점수가 아니에요. 언제든 다시 선택할 수 있어요.</p>
    </section>
  </template>

  <!-- 08. 작업 완료 후 일지 쓰기 -->
  <template id="view-checkout">
    <section class="screen">
      <div class="intro">
        <p class="eyebrow">SESSION NOTE</p>
        <h1 class="page-title">오늘은 어디까지<br>만들었나요?</h1>
        <p class="subtext">완료하지 못해도 괜찮아요. 실제로 한 만큼만 기록해요.</p>
      </div>
      <div class="task-preview">
        <span class="mini-kicker">오늘 하기로 한 일</span>
        <strong id="checkout-action-title"></strong>
        <small id="checkout-actual-minutes"></small>
      </div>
      <form class="paper" data-form="checkout">
        <div class="field">
          <span class="field-label">이번 작업은 어땠나요?</span>
          <div class="result-choices">
            <button class="choice-card" type="button" data-action="choose-result" data-value="completed"><span class="choice-title">해냈어요</span></button>
            <button class="choice-card" type="button" data-action="choose-result" data-value="partial"><span class="choice-title">일부 했어요</span></button>
            <button class="choice-card" type="button" data-action="choose-result" data-value="not_completed"><span class="choice-title">시작하지 못했어요</span></button>
          </div>
          <input type="hidden" id="checkout-result" name="result" value="completed">
        </div>
        <label class="field">
          <span class="field-label">오늘 실제로 남긴 것</span>
          <textarea class="text-area" name="proof" maxlength="400" placeholder="예: 도입부 첫 문단을 쓰고, 배경 장소를 확정했다."></textarea>
        </label>
        <label class="field">
          <span class="field-label">다음에 돌아왔을 때 가장 먼저 할 행동</span>
          <input class="text-input" name="nextAction" id="checkout-next-action" maxlength="140" placeholder="예: 인물이 처음 등장하는 문장 쓰기">
          <span class="field-help">여기를 적어두면 다음번에 무엇부터 할지 고민하지 않아도 돼요.</span>
        </label>
        <label class="checkline checkout-phase-done">
          <input type="checkbox" name="phaseDone">
          <span>이번 작업으로 이 단계 전체를 완성했어요</span>
        </label>
        <button class="primary full checkout-save" type="submit">오늘의 작업 일지 남기기 →</button>
      </form>
      <button class="quiet bottom-link" type="button" data-action="navigate" data-screen="focus">작업 화면으로 돌아가기</button>
    </section>
  </template>

  <!-- 09. 작업 기념 화면 -->
  <template id="view-reward">
    <section class="screen">
      <div class="hero">
        <span class="wordmark" aria-hidden="true">✳</span>
        <p class="eyebrow">A PAGE IN YOUR STORY</p>
        <h1 class="honor-quote" id="reward-heading"></h1>
        <p class="subtext" id="reward-subtext"></p>
        <div class="reward-note">
          <small id="reward-project"></small>
          <strong id="reward-proof"></strong>
          <span class="small-note reward-count" id="reward-count"></span>
        </div>
        <div class="button-row">
          <button class="primary" type="button" data-action="navigate" data-screen="home">내 작업실로 돌아가기 →</button>
          <button class="secondary" type="button" data-action="navigate" data-screen="journal">작업 일지 보기</button>
        </div>
      </div>
    </section>
  </template>

  <noscript>이 앱을 사용하려면 브라우저에서 JavaScript를 켜주세요.</noscript>
</body>
</html>
